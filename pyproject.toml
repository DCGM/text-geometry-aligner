[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-geometry-aligner"
version = "0.1.0"
description = "Bidirectional text and geometry alignment against ALTO OCR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Levenshtein~=0.27.3",
    "ortools~=9.14.6206",
    "Pillow>=10.0.1",
    "Shapely~=2.1.2",
]

[project.optional-dependencies]
# Test tooling. `pip install -e .[dev]` is all a contributor needs to run the
# suite; every runtime dependency the tests touch is already required above.
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
include = ["text_geometry_aligner*"]
exclude = ["text_geometry_aligner*.tests"]
# The co-located tests directories carry no __init__.py; disabling namespace
# discovery keeps them, and only them, out of the installed distribution.
namespaces = false

[tool.pytest.ini_options]
minversion = "8.0"
# importlib mode lets identically-named test modules coexist at different levels
# of the package tree (three test_reader.py, two test_writer.py) without
# __init__.py files.
addopts = [
    "-ra",
    "--strict-markers",
    "--import-mode=importlib",
]
testpaths = ["text_geometry_aligner"]

[tool.coverage.run]
source = ["text_geometry_aligner"]
omit = ["*/tests/*"]
